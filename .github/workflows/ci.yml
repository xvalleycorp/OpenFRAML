name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    # Real servers for the store and connector tests, which are skipped when these are not set
    services:
      valkey:
        image: valkey/valkey:9.0.6-alpine
        ports: ['6379:6379']
      kafka:
        image: apache/kafka:4.3.1
        ports: ['9092:9092']
    env:
      OPENFRAML_TEST_VALKEY: redis://localhost:6379
      OPENFRAML_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install RuleStone from source (not on Maven Central yet)
        run: ./scripts/install-rulestone.sh
      - name: Build and test
        run: mvn -B verify
      - name: Check dependency licences
        run: mvn -B -Plicense-check -DskipTests verify

  docs:
    name: English and Vietnamese docs match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-docs.py

  security:
    name: Vulnerability scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and secrets (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: openframl-sbom.spdx.json

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: ' || missing="$missing $commit"
          done
          if [ -n "$missing" ]; then
            echo "Commits without Signed-off-by (use git commit -s):"
            echo "$missing"
            exit 1
          fi
