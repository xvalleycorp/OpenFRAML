# Name rules for screening in Vietnam. Keys and values are normalised like names, so diacritics and case do not
# matter. See docs/screening.md.

# Business abbreviations common in Vietnamese company names, written out before names are compared
abbreviation.CTY = Công ty
abbreviation.TM = Thương mại
abbreviation.DV = Dịch vụ
abbreviation.SX = Sản xuất
abbreviation.XNK = Xuất nhập khẩu
abbreviation.XD = Xây dựng
abbreviation.DT = Đầu tư
abbreviation.CP = Cổ phần

# Legal forms, left out when the core of an organisation's name is compared ("Công ty TNHH MTV", "Tập đoàn")
legalForms = Công ty TNHH Cổ phần MTV Tập đoàn
