# Reason messages for investigators and reviewers. Never shown to customers: AML reasons are confidential.
BENEFICIARY_ON_WATCHLIST=The beneficiary account is on a list of suspicious accounts
REMOTE_ACCESS_DURING_PAYMENT=A remote-control or screen-sharing app was active while the payment was confirmed
ACTIVE_CALL_NEW_BENEFICIARY=The customer was on a phone call while paying a new beneficiary
NEW_DEVICE_LARGE_AMOUNT=Large payment from a device the customer has not used before
YOUNG_BENEFICIARY_ACCOUNT=Large payment to a recently opened account
NEW_BENEFICIARY_LARGE_AMOUNT=Large payment to a beneficiary the customer has never paid
RAPID_SUCCESSION=Many payment attempts within a few minutes
MANY_BENEFICIARIES=Payments to many different beneficiaries within a day
REPEATED_NEAR_LIMIT_TRANSFERS=Consecutive transfers close to the per-transfer limit
FRAUD_SCORE_HIGH=The fraud model rates the payment as very likely fraudulent
FRAUD_SCORE_ELEVATED=The fraud model rates the payment as possibly fraudulent
GATE_FAIL_CLOSED=Held without a full check: the beneficiary is on a list of suspicious accounts
GATE_FAIL_OPEN=Allowed without a full check: small payment to a known beneficiary; to be reviewed
GATE_DEGRADED=Challenged without a full check
GATE_FALLBACK_FAILED=Decided by the built-in last resort: the fallback policy could not run
CASH_STRUCTURING=Cash deposits split to stay below the large-value reporting threshold
PASS_THROUGH=Money passed through the account: most of what came in went out again within 48 hours
MANY_SENDERS=Money from many different senders in 24 hours
DORMANT_REACTIVATED=A large amount on an account inactive for six months or more
LARGE_CASH=Large-value cash transactions: one customer's cash in one day reached the reporting threshold
ELECTRONIC_TRANSFER=Electronic funds transfer at or above the reporting threshold
INTERNATIONAL_TRANSFER=International electronic funds transfer at or above the reporting threshold
