# Thông điệp lý do cho điều tra viên và người duyệt. Không hiển thị cho khách hàng: lý do AML phải giữ bí mật.
BENEFICIARY_ON_WATCHLIST=Tài khoản thụ hưởng nằm trong danh sách tài khoản nghi ngờ
REMOTE_ACCESS_DURING_PAYMENT=Có ứng dụng điều khiển từ xa hoặc chia sẻ màn hình khi khách hàng xác nhận giao dịch
ACTIVE_CALL_NEW_BENEFICIARY=Khách hàng đang nghe điện thoại khi chuyển tiền cho người thụ hưởng mới
NEW_DEVICE_LARGE_AMOUNT=Giao dịch lớn từ thiết bị khách hàng chưa từng dùng
YOUNG_BENEFICIARY_ACCOUNT=Giao dịch lớn tới tài khoản mới mở
NEW_BENEFICIARY_LARGE_AMOUNT=Giao dịch lớn tới người thụ hưởng khách hàng chưa từng chuyển
RAPID_SUCCESSION=Nhiều lệnh chuyển tiền trong vài phút
MANY_BENEFICIARIES=Chuyển tiền cho nhiều người thụ hưởng khác nhau trong một ngày
REPEATED_NEAR_LIMIT_TRANSFERS=Nhiều lệnh liên tiếp sát hạn mức mỗi lệnh
FRAUD_SCORE_HIGH=Model đánh giá giao dịch có khả năng gian lận rất cao
FRAUD_SCORE_ELEVATED=Model đánh giá giao dịch có khả năng gian lận
GATE_FAIL_CLOSED=Tạm giữ khi chưa kiểm tra đủ: tài khoản thụ hưởng nằm trong danh sách nghi ngờ
GATE_FAIL_OPEN=Cho qua khi chưa kiểm tra đủ: giá trị nhỏ, người thụ hưởng quen thuộc; cần xem lại
GATE_DEGRADED=Yêu cầu xác thực thêm khi chưa kiểm tra đủ
GATE_FALLBACK_FAILED=Quyết định theo phương án cuối cùng: không chạy được chính sách dự phòng
CASH_STRUCTURING=Nộp tiền mặt chia nhỏ để mỗi lần đều dưới ngưỡng giao dịch giá trị lớn phải báo cáo
PASS_THROUGH=Tài khoản dùng để chuyển tiếp tiền: phần lớn tiền vào đã được chuyển đi trong vòng 48 giờ
MANY_SENDERS=Nhận tiền từ nhiều người gửi khác nhau trong 24 giờ
DORMANT_REACTIVATED=Giao dịch lớn trên tài khoản không hoạt động từ sáu tháng trở lên
LARGE_CASH=Giao dịch tiền mặt giá trị lớn: tiền mặt của một khách hàng trong một ngày đạt ngưỡng phải báo cáo
ELECTRONIC_TRANSFER=Giao dịch chuyển tiền điện tử từ ngưỡng phải báo cáo trở lên
